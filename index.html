  <style>
    :root {
      --void:     #000000;
      --card:     rgba(14, 14, 14, 0.72);
      --border:   rgba(255, 255, 255, 0.055);
      --border-h: rgba(255, 255, 255, 0.11);
      --muted:    #767676;
      --white:    #ffffff;
      --blur:     16px;
      --r:        18px;
      --ease:     cubic-bezier(.4, 0, .2, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html { height: 100%; }

    body {
      min-height: 100%;
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--void);
      color: #d8d8d8;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image: url('bg.png');
      background-size: cover;
      background-position: center;
      filter: blur(12px) brightness(0.35) saturate(0.8);
      transform: scale(1.05);
      pointer-events: none;
    }

    #smoke {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    #vignette {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: radial-gradient(
        ellipse at center,
        transparent 20%,
        rgba(0, 0, 0, 0.6) 70%,
        rgba(0, 0, 0, 0.92) 100%
      );
    }

    #app {
      position: relative;
      z-index: 3;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 20px 64px;
      gap: 12px;
      opacity: 0;
      animation: pageIn 1.6s var(--ease) forwards 0.2s;
    }

    @keyframes pageIn {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--r);
      backdrop-filter: blur(var(--blur)) saturate(0.8) brightness(0.9);
      -webkit-backdrop-filter: blur(var(--blur)) saturate(0.8) brightness(0.9);
      padding: 44px 0 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.03),
        0 1px 0 rgba(255, 255, 255, 0.06) inset,
        0 32px 80px rgba(0, 0, 0, 0.7),
        0 8px 24px rgba(0, 0, 0, 0.5);
      transition: border-color 0.6s var(--ease);
    }

    .card:hover {
      border-color: var(--border-h);
    }

    .card-body {
      width: 100%;
      padding: 0 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .avatar-shell {
      position: relative;
      width: 88px;
      height: 88px;
      margin-top: 0;
      margin-bottom: 28px;
    }

    .avatar-shell::before {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.1),
        0 0 20px rgba(255, 255, 255, 0.07),
        0 0 40px rgba(255, 255, 255, 0.03);
      z-index: 0;
    }

    .avatar {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      filter: grayscale(1) contrast(0.85) brightness(0.9);
      transition: filter 1.2s var(--ease);
    }

    .avatar:hover {
      filter: grayscale(0.3) contrast(0.95) brightness(1.05);
    }

    .name {
      font-size: 1.55rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      color: var(--white);
      text-shadow:
        0 0 30px rgba(255, 255, 255, 0.18),
        0 0 80px rgba(255, 255, 255, 0.06);
      margin-bottom: 6px;
      line-height: 1;
    }

    .handle {
      font-size: 0.72rem;
      font-weight: 400;
      letter-spacing: 0.12em;
      color: var(--muted);
      text-transform: lowercase;
      margin-bottom: 20px;
    }

    .bio {
      font-size: 0.82rem;
      font-weight: 300;
      line-height: 1.75;
      color: #6e6e6e;
      text-align: center;
      max-width: 280px;
      margin-bottom: 32px;
      letter-spacing: 0.01em;
    }

    .rule {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.07) 50%, transparent);
      margin-bottom: 28px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }

    .link-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.02);
      color: #555;
      font-size: 0.78rem;
      font-weight: 400;
      letter-spacing: 0.06em;
      text-decoration: none;
      text-transform: lowercase;
      transition:
        background 0.35s var(--ease),
        border-color 0.35s var(--ease),
        color 0.35s var(--ease),
        transform 0.25s var(--ease);
    }

    .link-btn:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.13);
      color: #aaa;
      transform: translateX(3px);
    }

    .link-btn:focus-visible {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.25);
      color: #aaa;
      outline: 2px solid rgba(255, 255, 255, 0.35);
      outline-offset: 2px;
    }

    .link-btn:active {
      transform: translateX(1px);
    }

    .link-btn svg {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
      opacity: 0.5;
      transition: opacity 0.35s var(--ease);
    }

    .link-btn:hover svg {
      opacity: 0.85;
    }

    .link-btn .arrow {
      margin-left: auto;
      font-size: 0.65rem;
      opacity: 0;
      transform: translateX(-4px);
      transition:
        opacity 0.25s var(--ease),
        transform 0.25s var(--ease);
    }

    .link-btn:hover .arrow {
      opacity: 0.4;
      transform: translateX(0);
    }

    .footer {
      font-size: 0.62rem;
      font-weight: 300;
      letter-spacing: 0.1em;
      color: #3d3d3d;
      margin-top: 4px;
    }

    @media (max-width: 440px) {
      .card-body { padding: 0 22px; }
      .name  { font-size: 1.3rem; }
      .links { gap: 7px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      #app { opacity: 1; transform: none; }
    }

  <script>
    (function () {
      const canvas = document.getElementById('smoke');
      const ctx    = canvas.getContext('2d');

      let W, H, t = 0;

      function resize() {
        const dpr = window.devicePixelRatio || 1;
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width  = W * dpr;
        canvas.height = H * dpr;
        canvas.style.width  = W + 'px';
        canvas.style.height = H + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function createWisp(init) {
        return {
          x:       init ? Math.random() * W : 0,
          y:       H * 0.2 + Math.random() * H * 0.65,
          r:       120 + Math.random() * 260,
          vx:      0.06 + Math.random() * 0.12,
          vy:      (Math.random() - 0.5) * 0.04,
          alphaT:  0.012 + Math.random() * 0.022,
          breathe: 0.0003 + Math.random() * 0.0004,
          phase:   Math.random() * Math.PI * 2,
          shade:   Math.floor(200 + Math.random() * 55),
        };
      }

      function resetWisp(w) {
        Object.assign(w, {
          x:       -w.r,
          y:       H * 0.2 + Math.random() * H * 0.65,
          r:       120 + Math.random() * 260,
          vx:      0.06 + Math.random() * 0.12,
          vy:      (Math.random() - 0.5) * 0.04,
          alphaT:  0.012 + Math.random() * 0.022,
          breathe: 0.0003 + Math.random() * 0.0004,
          phase:   Math.random() * Math.PI * 2,
          shade:   Math.floor(200 + Math.random() * 55),
        });
      }

      window.addEventListener('resize', resize);
      resize();

      const wispCount = window.matchMedia('(max-width: 600px)').matches ? 22 : 38;
      const wisps = Array.from({ length: wispCount }, () => createWisp(true));

      let running = true;

      document.addEventListener('visibilitychange', () => {
        running = !document.hidden;
        if (running) draw();
      });

      function draw() {
        if (!running) return;

        ctx.clearRect(0, 0, W, H);
        t += 0.016;

        for (const w of wisps) {
          w.x += w.vx;
          w.y += w.vy + Math.sin(t * 0.4 + w.phase) * 0.06;

          if (w.x - w.r > W) resetWisp(w);

          const alpha = Math.max(0, w.alphaT + Math.sin(t * w.breathe * 200 + w.phase) * 0.005);
          const grad  = ctx.createRadialGradient(w.x, w.y, 0, w.x, w.y, w.r);
          const c     = w.shade;

          grad.addColorStop(0,    `rgba(${c},${c},${c},${alpha})`);
          grad.addColorStop(0.45, `rgba(${c},${c},${c},${alpha * 0.5})`);
          grad.addColorStop(1,    `rgba(${c},${c},${c},0)`);

          ctx.globalCompositeOperation = 'lighter';
          ctx.beginPath();
          ctx.arc(w.x, w.y, w.r, 0, Math.PI * 2);
          ctx.fillStyle = grad;
          ctx.fill();
        }

        requestAnimationFrame(draw);
      }

      draw();
    })();
  </script>

</body>
</html>
